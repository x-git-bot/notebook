name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'template.html'
      - 'android-app/**'
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the needed files exist
        run: |
          missing=0
          for f in index.html template.html manifest.json icons/icon-192.png icons/icon-512.png android-app/package.json android-app/capacitor.config.json; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in your repo: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web app into the Android project
        working-directory: android-app
        run: |
          rm -rf www && mkdir -p www
          cp ../index.html ../template.html ../manifest.json www/
          cp -r ../icons www/icons

      - name: Install
        working-directory: android-app
        run: npm install

      - name: Create Android project
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon and splash (optional)
        working-directory: android-app
        continue-on-error: true
        run: |
          test -f assets/logo.png
          npx @capacitor/assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000"

      - name: Keep the same signing 
key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: notes-debug-keystore-v1

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-APK
          path: android-app/android/
app/build/outputs/apk/debug/app-debug.apk
