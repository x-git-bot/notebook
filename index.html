<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Notes</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#0b0b0b; --s2:#141414; --line:#232323; --line2:#333;
  --tx:#f2f2f2; --mu:#8a8a8a; --red:#d71921;
  --dot:'Doto','Space Mono',ui-monospace,monospace;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100%}
html{background:#000}
body{background:none;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(#1b1b1b 1px,transparent 1.2px) 0 0/18px 18px}
.si{width:18px;height:18px;display:block;margin:auto}
.sub .nm small{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:.5px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--tx)}
.chip.late{border-color:var(--red);color:var(--red)}
.rev{display:flex;align-items:center;gap:12px;cursor:pointer;border-color:var(--line2)}
.rev .nm{flex:1;font-family:var(--dot);font-weight:900;font-size:22px}
.rev .big{font-family:var(--dot);font-weight:900;font-size:34px;color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 16px}
.cal i,.cal em{font-style:normal;text-align:center;font-family:var(--mono);font-size:10px;color:var(--mu)}
.day{aspect-ratio:1;background:var(--s1);border:1px solid var(--line);border-radius:14px;color:var(--tx);position:relative;font-family:var(--mono);font-size:13px;padding:0}
.day b{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--red)}
.day b.ok{background:var(--mu)}
.day.today{border-color:var(--tx)}.day.sel{background:var(--tx);color:#000}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--dot);font-weight:900;font-size:24px}
.mini{padding:7px 14px;font-size:11px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-family:var(--dot);font-weight:900;font-size:34px;letter-spacing:2px;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--red);display:inline-block}
.label{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu)}
h1.t{font-family:var(--dot);font-weight:900;font-size:40px;margin:6px 0 4px;line-height:1.05;word-break:break-word}
.btn{background:var(--tx);color:#000;border:0;border-radius:999px;padding:11px 20px;font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.red{background:var(--red);color:#fff}
.btn:active{transform:scale(.97)}
.ic{background:none;border:0;color:var(--mu);width:34px;height:34px;border-radius:50%;padding:0;flex:none}
.ic:hover,.ic:active{background:var(--s2);color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.subj{display:flex;align-items:center;gap:10px;cursor:pointer}
.subj:active{background:var(--s2)}
.subj .nm{flex:1;font-size:19px;font-weight:500;word-break:break-word}
.subj .ct{font-family:var(--mono);font-size:11px;color:var(--mu)}
.topic-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.topic-h .nm{flex:1;font-family:var(--dot);font-weight:900;font-size:24px;word-break:break-word}
.sub{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px dashed var(--line2);cursor:pointer}
.sub .nm{flex:1;font-size:16px;word-break:break-word}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--red);flex:none}
.dot.on{background:var(--tx);border-color:var(--tx)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--mu);text-transform:uppercase}
.add{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line2);color:var(--mu);border-radius:14px;padding:11px;font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.add:active{background:var(--s2);color:var(--tx)}
.back{background:none;border:0;color:var(--mu);font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 0;margin-bottom:6px}
.empty{text-align:center;color:var(--mu);font-family:var(--mono);font-size:12px;padding:40px 10px;line-height:1.8}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:var(--s2);border:1px solid var(--line2);border-radius:26px;padding:22px;width:100%;max-width:380px}
.box h3{margin:0 0 12px;font-family:var(--dot);font-weight:900;font-size:24px}
.box p{color:var(--mu);font-size:14px;line-height:1.5;margin:0 0 14px}
.box input,.login input{width:100%;background:#000;border:1px solid var(--line2);border-radius:14px;padding:13px 14px;color:var(--tx);font-family:var(--mono);font-size:15px;outline:none;margin-bottom:14px}
.box input:focus,.login input:focus{border-color:var(--red)}
.row{display:flex;gap:10px;justify-content:flex-end}
/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:360px;margin:0 auto;padding:20px}
.login .logo{font-size:56px;margin-bottom:6px}
.err{color:var(--red);font-family:var(--mono);font-size:12px;min-height:18px;margin-bottom:10px}
/* editor */
.ed-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
textarea.code{width:100%;height:55dvh;background:#000;border:1px solid var(--line2);border-radius:18px;padding:14px;color:#dcdcdc;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;outline:none;tab-size:2;white-space:pre}
textarea.code:focus{border-color:var(--red)}
iframe.pv{width:100%;height:60dvh;border:1px solid var(--line2);border-radius:18px;background:#fff}
/* viewer */
.vbar{position:fixed;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:#000;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:12px;padding-right:12px;z-index:10}
.vbar .nm{flex:1;font-family:var(--dot);font-weight:900;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
iframe.full{position:fixed;left:0;right:0;bottom:0;top:calc(52px + env(safe-area-inset-top));width:100%;height:calc(100dvh - 52px - env(safe-area-inset-top));border:0;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#000;font-family:var(--mono);font-size:12px;padding:10px 18px;border-radius:999px;z-index:60}
.sync{font-family:var(--mono);font-size:10px;color:var(--mu)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById('app');
let pass = localStorage.getItem('nn_pass') || '';
let tree = { subjects: [] };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const go = p => { location.hash = p; };

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

const I={edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',power:'<path d="M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',back:'<path d="M15 5l-7 7 7 7"/>',reset:'<path d="M4 12a8 8 0 1 1 3 6.2M4 19v-5h5"/>',l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>'};
const ic = n => `<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const fmt = s => new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const INT = [1, 3, 7, 21, 45]; // spaced repetition gaps (days after study date)
function tasks() {
  const out = [];
  tree.subjects.forEach(s => s.topics.forEach(t => t.subs.forEach(x => {
    if (!x.date) return;
    INT.forEach((n, i) => { const due = addDays(x.date, n); out.push({ s, t, x, due, r: i + 1, done: (x.done || []).includes(due) }); });
  })));
  return out;
}

/* ---- MCQ progress bridge: pages talk to the server through NP ---- */
const HELPER = '<script>(function(){var s={},rs=[];window.NP={loaded:false,data:function(){return s},record:function(id,ok){var a=s[id]||(s[id]={c:0,w:0});ok?a.c++:a.w++;a.last=!!ok;a.t=Date.now();parent.postMessage({np:"rec",id:id,ok:!!ok},"*");return a},onReady:function(f){rs.push(f);if(NP.loaded)f()}};addEventListener("message",function(e){if(e.data&&e.data.np==="init"){s=e.data.data||{};NP.loaded=true;rs.forEach(function(f){f()})}});parent.postMessage({np:"hello"},"*")})()<\/script>';
const wrap = h => /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + HELPER) : HELPER + h;
let cur = null, saveT = null, pending = null;
function sums(p) { let c = 0, w = 0; for (const k in p) { c += p[k].c || 0; w += p[k].w || 0; } return { c, w }; }
function updStat() { const el = document.getElementById('st'); if (el && cur) { const { c, w } = sums(cur.prog); el.textContent = `${c} right · ${w} wrong`; } }
async function doSave() {
  saveT = null; const c = pending; if (!c || !c.save) return;
  try {
    await api('saveProgress', { id: c.id, data: c.prog });
    const f = findSub(c.id); if (f) { f.x.stats = sums(c.prog); await persist(); }
  } catch (e) { toast('Progress not saved'); }
}
function flush() { if (saveT) { clearTimeout(saveT); doSave(); } }
window.addEventListener('message', e => {
  const m = e.data; if (!m || !m.np || !cur) return;
  const fr = document.getElementById(cur.frame); if (!fr || e.source !== fr.contentWindow) return;
  if (m.np === 'hello') return fr.contentWindow.postMessage({ np: 'init', data: cur.prog }, '*');
  if (m.np === 'rec') {
    const a = cur.prog[m.id] || (cur.prog[m.id] = { c: 0, w: 0 });
    m.ok ? a.c++ : a.w++; a.last = !!m.ok; a.t = Date.now(); updStat();
    if (cur.save) { pending = cur; clearTimeout(saveT); saveT = setTimeout(doSave, 900); }
  }
});

async function api(action, data = {}) {
  const r = await fetch('/api/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-password': pass },
    body: JSON.stringify({ action, ...data })
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error('Wrong password'); e.auth = true; throw e; }
  if (!r.ok) throw new Error(j.error || 'Server error');
  return j;
}

async function persist() {
  try { await api('saveTree', { tree }); }
  catch (e) { toast('Save failed: ' + e.message); }
}

function ask({ title, value = '', type = 'text', input = true, ok = 'OK', danger = false, msg = '' }) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<div class="box"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}
      ${input ? `<input id="mi" type="${type}" value="${esc(value)}" maxlength="80" autocomplete="off">` : ''}
      <div class="row"><button class="btn ghost" id="mc">Cancel</button>
      <button class="btn ${danger ? 'red' : ''}" id="mo">${esc(ok)}</button></div></div>`;
    document.body.appendChild(d);
    const i = d.querySelector('#mi');
    if (i) { i.focus(); if (type === 'text') i.select(); i.addEventListener('keydown', e => { if (e.key === 'Enter') d.querySelector('#mo').click(); }); }
    const close = v => { d.remove(); res(v); };
    d.querySelector('#mc').onclick = () => close(null);
    d.querySelector('#mo').onclick = () => close(input ? (i.value.trim() || null) : true);
    d.onclick = e => { if (e.target === d) close(null); };
  });
}

/* ---------- tree helpers ---------- */
function findSubject(id) { return tree.subjects.find(s => s.id === id); }
function findTopic(id) { for (const s of tree.subjects) { const t = s.topics.find(t => t.id === id); if (t) return { s, t }; } }
function findSub(id) { for (const s of tree.subjects) for (const t of s.topics) { const x = t.subs.find(x => x.id === id); if (x) return { s, t, x }; } }
const subIdsOfTopic = t => t.subs.map(x => x.id);
const subIdsOfSubject = s => s.topics.flatMap(subIdsOfTopic);

/* ---------- views ---------- */
function viewLogin(err = '') {
  app.innerHTML = `<div class="login">
    <div class="logo">NOTES<i></i></div>
    <div class="label" style="margin-bottom:28px">Private vault</div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="er">${esc(err)}</div>
    <button class="btn" id="go">Unlock</button></div>`;
  const pw = document.getElementById('pw');
  const submit = async () => {
    pass = pw.value;
    try { await api('ping'); localStorage.setItem('nn_pass', pass); await boot(); }
    catch (e) { pass = ''; document.getElementById('er').textContent = e.message; }
  };
  document.getElementById('go').onclick = submit;
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  pw.focus();
}

function viewHome() {
  const dueN = tasks().filter(k => !k.done && k.due <= today()).length;
  const list = tree.subjects.map(s => {
    const n = subIdsOfSubject(s).length;
    return `<div class="card subj" data-a="openSubject" data-id="${s.id}">
      <span class="nm">${esc(s.name)}</span>
      <span class="ct">${s.topics.length}T · ${n}S</span>
      <button class="ic" data-a="renSubject" data-id="${s.id}">${ic('edit')}</button>
      <button class="ic" data-a="delSubject" data-id="${s.id}">${ic('x')}</button></div>`;
  }).join('');
  app.innerHTML = `<div class="wrap">
    <div class="top"><div class="logo">NOTES<i></i></div>
      <button class="ic" data-a="logout" title="Lock">${ic('power')}</button></div>
    <div class="card rev" data-a="rev"><span class="big">${dueN}</span><span class="nm">Today’s revision</span>${ic('cal')}</div>
    <div class="label" style="margin:18px 0 12px">Subjects</div>
    ${list || `<div class="empty">NO SUBJECTS YET<br>TAP + TO ADD ONE</div>`}
    <button class="add" data-a="addSubject">+ Add subject</button></div>`;
}

function viewSubject(sid) {
  const s = findSubject(sid); if (!s) return go('/');
  const topics = s.topics.map(t => `<div class="card">
    <div class="topic-h"><span class="nm">${esc(t.name)}</span>
      <button class="ic" data-a="renTopic" data-id="${t.id}">${ic('edit')}</button>
      <button class="ic" data-a="delTopic" data-id="${t.id}">${ic('x')}</button></div>
    ${t.subs.map(x => `<div class="sub" data-a="openSub" data-id="${x.id}">
      <span class="dot ${x.locked ? 'on' : ''}"></span><div class="nm">${esc(x.name)}<small><span class="chip" data-a="setDate" data-id="${x.id}">${x.date ? fmt(x.date) : '+ date'}</span>${x.stats && (x.stats.c + x.stats.w) ? `<span>Right ${x.stats.c} · Wrong ${x.stats.w}</span>` : ''}</small></div>
      <span class="tag">${x.locked ? 'Open' : 'Edit'}</span>
      <button class="ic" data-a="renSub" data-id="${x.id}">${ic('edit')}</button>
      <button class="ic" data-a="delSub" data-id="${x.id}">${ic('x')}</button></div>`).join('')}
    <button class="add" data-a="addSub" data-id="${t.id}">+ Add sub topic</button></div>`).join('');
  app.innerHTML = `<div class="wrap">
    <button class="back" data-a="home">← Subjects</button>
    <div class="label">Subject</div><h1 class="t">${esc(s.name)}</h1>
    <div class="label" style="margin:18px 0 12px">Topics</div>
    ${topics || `<div class="empty">NO TOPICS YET</div>`}
    <button class="add" data-a="addTopic" data-id="${s.id}">+ Add topic</button></div>`;
}

async function viewEditor(id) {
  const f = findSub(id); if (!f) return go('/');
  if (f.x.locked) return go('/v/' + id);
  app.innerHTML = `<div class="wrap"><div class="empty">LOADING…</div></div>`;
  let html = '';
  try { html = (await api('getPage', { id })).html; } catch (e) { toast(e.message); }
  app.innerHTML = `<div class="wrap">
    <button class="back" data-a="backSubject" data-id="${f.s.id}">← ${esc(f.s.name)}</button>
    <div class="label">${esc(f.t.name)}</div><h1 class="t">${esc(f.x.name)}</h1>
    <div class="ed-bar">
      <button class="btn ghost" id="up">Upload</button>
      <button class="btn ghost" id="tp">Template</button>
      <button class="btn ghost" id="pp">AI prompt</button>
      <button class="btn ghost" id="pvb">Preview</button>
      <button class="btn red" id="sv">Save &amp; lock</button>
      <input type="file" id="fi" accept=".html,.htm,text/html" hidden></div>
    <textarea class="code" id="ed" spellcheck="false" placeholder="Paste your HTML here, or upload a .html file…"></textarea>
    <div id="pvwrap" style="display:none"><iframe class="pv" id="pv" sandbox="allow-scripts allow-popups allow-forms allow-modals"></iframe></div>
    </div>`;
  const ed = document.getElementById('ed'); ed.value = html;
  const pvw = document.getElementById('pvwrap'), pv = document.getElementById('pv');
  document.getElementById('up').onclick = () => document.getElementById('fi').click();
  const getTpl = async () => (await fetch('/template.html')).text();
  document.getElementById('tp').onclick = async () => {
    if (ed.value.trim() && !await ask({ title: 'Replace with template?', input: false, ok: 'Replace', danger: true, msg: 'Your current text will be overwritten.' })) return;
    ed.value = await getTpl(); toast('Template loaded');
  };
  document.getElementById('pp').onclick = async () => {
    try { await navigator.clipboard.writeText(PROMPT + '\n\nTEMPLATE:\n' + await getTpl() + '\n\nMY NOTES:\n'); toast('Prompt + template copied'); }
    catch { toast('Copy failed'); }
  };
  document.getElementById('fi').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    ed.value = await file.text(); toast('File loaded');
  };
  document.getElementById('pvb').onclick = () => {
    const show = pvw.style.display === 'none';
    pvw.style.display = show ? 'block' : 'none';
    ed.style.display = show ? 'none' : 'block';
    document.getElementById('pvb').textContent = show ? 'Edit' : 'Preview';
    if (show) { cur = { id, frame: 'pv', prog: {}, save: false }; pv.srcdoc = wrap(ed.value); }
  };
  document.getElementById('sv').onclick = async () => {
    if (!ed.value.trim()) return toast('Add some HTML first');
    const ok = await ask({ title: 'Save & lock?', input: false, ok: 'Save', danger: true,
      msg: 'After saving you can’t edit this sub topic. Tapping it will open your page.' });
    if (!ok) return;
    try {
      await api('savePage', { id, html: ed.value });
      f.x.locked = true; await api('saveTree', { tree });
      toast('Saved'); go('/v/' + id);
    } catch (e) { toast('Failed: ' + e.message); }
  };
}

async function viewPage(id) {
  const f = findSub(id); if (!f) return go('/');
  if (!f.x.locked) return go('/e/' + id);
  app.innerHTML = `<div class="vbar">
    <button class="ic" data-a="backSubject" data-id="${f.s.id}">${ic('back')}</button>
    <span class="nm">${esc(f.x.name)}</span><span class="sync" id="st"></span>
    <button class="ic" data-a="resetProg" data-id="${id}" title="Reset MCQ progress">${ic('reset')}</button>
    <button class="ic" data-a="unlock" data-id="${id}" title="Unlock to edit">${ic('edit')}</button></div>
    <iframe class="full" id="fr" sandbox="allow-scripts allow-popups allow-forms allow-modals"></iframe>`;
  try {
    const [pg, pr] = await Promise.all([api('getPage', { id }), api('getProgress', { id })]);
    cur = { id, frame: 'fr', prog: pr.data || {}, save: true }; updStat();
    document.getElementById('fr').srcdoc = wrap(pg.html || '<p style="font-family:sans-serif;padding:20px">Empty page.</p>');
  }
  catch (e) { toast(e.message); }
}

let cal = { m: new Date(), sel: today() };
function taskRow(k) {
  const late = !k.done && k.due < today();
  return `<div class="sub"><button class="ic" data-a="toggleRev" data-id="${k.x.id}" data-due="${k.due}"><span class="dot ${k.done ? 'on' : ''}" style="margin:auto"></span></button>
    <div class="nm" data-a="openSub" data-id="${k.x.id}">${esc(k.x.name)}<small><span>${esc(k.s.name)} › ${esc(k.t.name)}</span><span class="chip ${late ? 'late' : ''}">R${k.r}${late ? ' · overdue ' + fmt(k.due) : ''}</span></small></div></div>`;
}
function viewRev() {
  const T = tasks(), td = today();
  const due = T.filter(k => !k.done && k.due <= td).sort((a, b) => a.due < b.due ? -1 : 1);
  const y = cal.m.getFullYear(), mo = cal.m.getMonth();
  const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
  let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<em>${d}</em>`).join('') + '<i></i>'.repeat(first);
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(mo + 1)}-${pad(d)}`, n = T.filter(k => k.due === ds), un = n.filter(k => !k.done).length;
    cells += `<button class="day ${ds === td ? 'today' : ''} ${ds === cal.sel ? 'sel' : ''}" data-a="selDay" data-id="${ds}">${d}${n.length ? `<b class="${un ? '' : 'ok'}"></b>` : ''}</button>`;
  }
  const sel = T.filter(k => k.due === cal.sel);
  app.innerHTML = `<div class="wrap">
    <button class="back" data-a="home">← Home</button>
    <h1 class="t">Revision</h1>
    <div class="label" style="margin:14px 0 6px">Due today · ${due.length}</div>
    <div class="card" style="padding:6px 14px">${due.map(taskRow).join('') || '<div class="empty">ALL CAUGHT UP</div>'}</div>
    <div class="cal-h" style="margin-top:22px"><button class="ic" data-a="prevM">${ic('l')}</button>
      <span>${cal.m.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</span><button class="ic" data-a="nextM">${ic('r')}</button></div>
    <div class="cal">${cells}</div>
    <div class="label" style="margin-bottom:6px">${fmt(cal.sel)}${cal.sel === td ? ' · today' : ''} · ${sel.length} task${sel.length === 1 ? '' : 's'}</div>
    <div class="card" style="padding:6px 14px">${sel.map(taskRow).join('') || '<div class="empty">NOTHING SCHEDULED</div>'}</div></div>`;
}
const PROMPT = `Make ONE self-contained HTML file from MY NOTES below, using the TEMPLATE exactly (keep every ===== marker comment).
- Theme: Nothing OS (pure black, white text, red #d71921 accent, Doto dot headings, Space Mono labels, no emoji).
- Use ONLY my notes; no outside facts. Short bullets, tables where useful.
- Notes: one <section class="note"> per concept.
- MCQs: 15-25, one per line in MCQS: {id,q,o:[4],a:0-3,e:short}. Unique permanent ids (q1, q2...). Mix recall, application, traps.
- Keep NP.record() tracking from the engine; no localStorage.
- Output code only.`;

/* ---------- actions ---------- */
const actions = {
  home: () => go('/'),
  rev: () => go('/r'),
  selDay: id => { cal.sel = id; viewRev(); },
  prevM: () => { cal.m = new Date(cal.m.getFullYear(), cal.m.getMonth() - 1, 1); viewRev(); },
  nextM: () => { cal.m = new Date(cal.m.getFullYear(), cal.m.getMonth() + 1, 1); viewRev(); },
  async toggleRev(id, d) {
    const x = findSub(id).x, a = x.done || (x.done = []), i = a.indexOf(d.due);
    i < 0 ? a.push(d.due) : a.splice(i, 1); await persist(); viewRev();
  },
  async setDate(id) {
    const { x } = findSub(id);
    const v = await ask({ title: 'Study date', type: 'date', value: x.date || today(), ok: 'Save', msg: 'Revisions are scheduled at +1, 3, 7, 21 and 45 days from this date.' });
    if (!v) return;
    x.date = v; x.done = (x.done || []).filter(d => INT.some(n => addDays(v, n) === d)); await persist(); route();
  },
  async resetProg(id) {
    if (!await ask({ title: 'Reset MCQ progress?', input: false, ok: 'Reset', danger: true, msg: 'Correct/wrong history for this page will be cleared.' })) return;
    await api('saveProgress', { id, data: {} }); findSub(id).x.stats = null; await persist(); route();
  },
  logout: () => { localStorage.removeItem('nn_pass'); pass = ''; viewLogin(); },
  openSubject: id => go('/s/' + id),
  backSubject: id => go('/s/' + id),
  openSub: id => { const f = findSub(id); go((f.x.locked ? '/v/' : '/e/') + id); },

  async addSubject() {
    const n = await ask({ title: 'New subject', ok: 'Add' }); if (!n) return;
    tree.subjects.push({ id: uid(), name: n, topics: [] }); await persist(); route();
  },
  async renSubject(id) {
    const s = findSubject(id); const n = await ask({ title: 'Rename subject', value: s.name, ok: 'Save' });
    if (n) { s.name = n; await persist(); route(); }
  },
  async delSubject(id) {
    const s = findSubject(id);
    if (!await ask({ title: 'Delete subject?', input: false, ok: 'Delete', danger: true, msg: `“${s.name}” and everything inside it will be removed.` })) return;
    const ids = subIdsOfSubject(s);
    tree.subjects = tree.subjects.filter(x => x.id !== id);
    await persist(); api('deletePages', { ids }).catch(() => {}); route();
  },

  async addTopic(sid) {
    const n = await ask({ title: 'New topic', ok: 'Add' }); if (!n) return;
    findSubject(sid).topics.push({ id: uid(), name: n, subs: [] }); await persist(); route();
  },
  async renTopic(id) {
    const { t } = findTopic(id); const n = await ask({ title: 'Rename topic', value: t.name, ok: 'Save' });
    if (n) { t.name = n; await persist(); route(); }
  },
  async delTopic(id) {
    const { s, t } = findTopic(id);
    if (!await ask({ title: 'Delete topic?', input: false, ok: 'Delete', danger: true, msg: `“${t.name}” and its sub topics will be removed.` })) return;
    const ids = subIdsOfTopic(t); s.topics = s.topics.filter(x => x.id !== id);
    await persist(); api('deletePages', { ids }).catch(() => {}); route();
  },

  async addSub(tid) {
    const n = await ask({ title: 'New sub topic', ok: 'Add' }); if (!n) return;
    findTopic(tid).t.subs.push({ id: uid(), name: n, locked: false, date: today(), done: [] }); await persist(); route();
  },
  async renSub(id) {
    const { x } = findSub(id); const n = await ask({ title: 'Rename sub topic', value: x.name, ok: 'Save' });
    if (n) { x.name = n; await persist(); route(); }
  },
  async delSub(id) {
    const { t, x } = findSub(id);
    if (!await ask({ title: 'Delete sub topic?', input: false, ok: 'Delete', danger: true, msg: `“${x.name}” and its HTML will be removed.` })) return;
    t.subs = t.subs.filter(y => y.id !== id);
    await persist(); api('deletePages', { ids: [id] }).catch(() => {}); route();
  },
  async unlock(id) {
    const { x } = findSub(id);
    if (!await ask({ title: 'Unlock to edit?', input: false, ok: 'Unlock', msg: 'This lets you replace the HTML again. Save to lock it once more.' })) return;
    x.locked = false; await persist(); go('/e/' + id);
  }
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  e.stopPropagation();
  const fn = actions[el.dataset.a]; if (fn) fn(el.dataset.id, el.dataset);
});

/* ---------- router ---------- */
function route() {
  if (!pass) return viewLogin();
  const [, k, id] = (location.hash.slice(1) || '/').split('/');
  flush(); cur = null;
  window.scrollTo(0, 0);
  if (k === 'r') return viewRev();
  if (k === 's') return viewSubject(id);
  if (k === 'e') return viewEditor(id);
  if (k === 'v') return viewPage(id);
  viewHome();
}
window.addEventListener('hashchange', route);

async function boot() {
  try { tree = (await api('getTree')).tree; route(); }
  catch (e) {
    if (e.auth) { localStorage.removeItem('nn_pass'); pass = ''; return viewLogin('Wrong password'); }
    app.innerHTML = `<div class="wrap"><div class="empty">${esc(e.message)}<br><br><button class="btn ghost" onclick="boot()">Retry</button></div></div>`;
  }
}

// sync across devices when you come back to the app
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !pass) return;
  const k = (location.hash.split('/')[1] || '');
  if (k === 'e' || k === 'v') return;
  try { tree = (await api('getTree')).tree; route(); } catch {}
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
pass ? boot() : viewLogin();
</script>
</body>
