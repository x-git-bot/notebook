<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Notes</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#0b0b0b; --s2:#141414; --line:#232323; --line2:#333;
  --tx:#f2f2f2; --mu:#8a8a8a; --red:#d71921;
  --dot:'Doto','Space Mono',ui-monospace,monospace;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100%}
html{background:#000}
body{background:none;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(#1b1b1b 1px,transparent 1.2px) 0 0/18px 18px}
.si{width:18px;height:18px;display:block;margin:auto}
.sub .nm small{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:.5px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--tx)}
.chip.late{border-color:var(--red);color:var(--red)}
.rev{display:flex;align-items:center;gap:12px;cursor:pointer;border-color:var(--line2)}
.rev .nm{flex:1;font-family:var(--dot);font-weight:900;font-size:22px}
.rev .big{font-family:var(--dot);font-weight:900;font-size:34px;color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 16px}
.cal i,.cal em{font-style:normal;text-align:center;font-family:var(--mono);font-size:10px;color:var(--mu)}
.day{aspect-ratio:1;background:var(--s1);border:1px solid var(--line);border-radius:14px;color:var(--tx);position:relative;font-family:var(--mono);font-size:13px;padding:0}
.day b{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--red)}
.day b.ok{background:var(--mu)}
.day.today{border-color:var(--tx)}.day.sel{background:var(--tx);color:#000}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--dot);font-weight:900;font-size:24px}
.mini{padding:7px 14px;font-size:11px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-family:var(--dot);font-weight:900;font-size:34px;letter-spacing:2px;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--red);display:inline-block}
.label{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu)}
h1.t{font-family:var(--dot);font-weight:900;font-size:40px;margin:6px 0 4px;line-height:1.05;word-break:break-word}
.btn{background:var(--tx);color:#000;border:0;border-radius:999px;padding:11px 20px;font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.red{background:var(--red);color:#fff}
.btn:active{transform:scale(.97)}
.ic{background:none;border:0;color:var(--mu);width:34px;height:34px;border-radius:50%;padding:0;flex:none}
.ic:hover,.ic:active{background:var(--s2);color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.subj{display:flex;align-items:center;gap:10px;cursor:pointer}
.subj:active{background:var(--s2)}
.subj .nm{flex:1;font-size:19px;font-weight:500;word-break:break-word}
.subj .ct{font-family:var(--mono);font-size:11px;color:var(--mu)}
.topic-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.topic-h .nm{flex:1;font-family:var(--dot);font-weight:900;font-size:24px;word-break:break-word}
.sub{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px dashed var(--line2);cursor:pointer}
.sub .nm{flex:1;font-size:16px;word-break:break-word}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--red);flex:none}
.dot.on{background:var(--tx);border-color:var(--tx)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--mu);text-transform:uppercase}
.add{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line2);color:var(--mu);border-radius:14px;padding:11px;font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.add:active{background:var(--s2);color:var(--tx)}
.back{background:none;border:0;color:var(--mu);font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 0;margin-bottom:6px}
.empty{text-align:center;color:var(--mu);font-family:var(--mono);font-size:12px;padding:40px 10px;line-height:1.8}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:var(--s2);border:1px solid var(--line2);border-radius:26px;padding:22px;width:100%;max-width:380px}
.box h3{margin:0 0 12px;font-family:var(--dot);font-weight:900;font-size:24px}
.box p{color:var(--mu);font-size:14px;line-height:1.5;margin:0 0 14px}
.box input,.login input{width:100%;background:#000;border:1px solid var(--line2);border-radius:14px;padding:13px 14px;color:var(--tx);font-family:var(--mono);font-size:15px;outline:none;margin-bottom:14px}
.box input:focus,.login input:focus{border-color:var(--red)}
.row{display:flex;gap:10px;justify-content:flex-end}
/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:360px;margin:0 auto;padding:20px}
.login .logo{font-size:56px;margin-bottom:6px}
.err{color:var(--red);font-family:var(--mono);font-size:12px;min-height:18px;margin-bottom:10px}
/* editor */
.ed-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
textarea.code{width:100%;height:55dvh;background:#000;border:1px solid var(--line2);border-radius:18px;padding:14px;color:#dcdcdc;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;outline:none;tab-size:2;white-space:pre}
textarea.code:focus{border-color:var(--red)}
iframe.pv{width:100%;height:60dvh;border:1px solid var(--line2);border-radius:18px;background:#fff}
/* viewer */
.vbar{position:fixed;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:#000;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:12px;padding-right:12px;z-index:10}
.vbar .nm{flex:1;font-family:var(--dot);font-weight:900;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
iframe.full{position:fixed;left:0;right:0;bottom:0;top:calc(52px + env(safe-area-inset-top));width:100%;height:calc(100dvh - 52px - env(safe-area-inset-top));border:0;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#000;font-family:var(--mono);font-size:12px;padding:10px 18px;border-radius:999px;z-index:60}
.sync{font-family:var(--mono);font-size:10px;color:var(--mu)}
.grip{touch-action:none;cursor:grab;width:28px;color:var(--line2)}
.dragging{opacity:.55;outline:1px dashed var(--red);user-select:none}
.subs{min-height:14px}
.dot.st-revision{background:var(--red);border-color:var(--red)}.dot.st-completed{background:var(--tx);border-color:var(--tx)}
.chip.st{border-color:var(--red)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.btn.on{background:var(--tx);color:#000}
.box{max-height:90dvh;overflow:auto}
.box textarea{width:100%;background:#000;border:1px solid var(--line2);border-radius:14px;padding:12px;color:var(--tx);font-family:var(--mono);font-size:13px;margin-bottom:14px;outline:none;resize:vertical}
.box textarea:focus{border-color:var(--red)}
.pr-t{color:var(--mu);font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.boot{font-family:var(--mono);color:var(--mu);text-align:center;padding:38vh 20px 0;letter-spacing:1px;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div id="app"><div class="boot">LOADING… · build 7</div></div>

<script>
(function () {
  var a = document.getElementById('app');
  window.nnReset = function () {
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
    Promise.all(jobs).catch(function () {}).then(function () {
      try { indexedDB.deleteDatabase('nn'); } catch (e) {}
      setTimeout(function () { location.reload(); }, 600);
    });
  };
  function fail(m) {
    if (!a || a.getAttribute('data-ok') === '1') return;
    a.innerHTML = '<div class="boot">' + String(m).replace(/</g, '&lt;') + '<br><br><button onclick="nnReset()" style="background:#f2f2f2;color:#000;border:0;border-radius:999px;padding:10px 20px;font:12px monospace">Reset app cache &amp; reload</button></div>';
  }
  window.addEventListener('error', function (e) { fail('Error: ' + (e.message || 'unknown')); });
  window.addEventListener('unhandledrejection', function (e) { fail('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () { fail('The app did not start (build 7).'); }, 6000);
})();
</script>
<script>
const app = document.getElementById('app');
let pass = localStorage.getItem('nn_pass') || '';
let tree = { subjects: [] };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const go = p => { location.hash = p; };

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

const I={edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',power:'<path d="M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',back:'<path d="M15 5l-7 7 7 7"/>',reset:'<path d="M4 12a8 8 0 1 1 3 6.2M4 19v-5h5"/>',grip:'<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>'};
const ic = n => `<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const fmt = s => new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const INT = [1, 3, 7, 21, 45]; // spaced repetition gaps (days after study date)
function tasks() {
  const out = [];
  tree.subjects.forEach(s => s.topics.forEach(t => t.subs.forEach(x => {
    if (x.status !== 'revision' || !x.date) return;
    INT.forEach((n, i) => { const due = addDays(x.date, n); out.push({ s, t, x, due, r: i + 1, done: (x.done || []).includes(due) }); });
  })));
  return out;
}

/* ---- MCQ progress bridge: pages talk to the server through NP ---- */
const HELPER = '<script>(function(){var s={},rs=[];window.NP={loaded:false,data:function(){return s},record:function(id,ok,p){var a=s[id]||(s[id]={c:0,w:0});ok?a.c++:a.w++;a.last=!!ok;a.p=p;a.t=Date.now();parent.postMessage({np:"rec",id:id,ok:!!ok,p:p},"*");return a},onReady:function(f){rs.push(f);if(NP.loaded)f()}};addEventListener("message",function(e){if(e.data&&e.data.np==="init"){s=e.data.data||{};if(e.data.css){var st=document.createElement("style");st.textContent=e.data.css;(document.head||document.documentElement).appendChild(st)}NP.loaded=true;rs.forEach(function(f){f()})}});parent.postMessage({np:"hello"},"*")})()<\/script>';
const wrap = h => /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + HELPER) : HELPER + h;
let cur = null, saveT = null, pending = null;
function sums(p) { let c = 0, w = 0; for (const k in p) { c += p[k].c || 0; w += p[k].w || 0; } return { c, w }; }
function updStat() { const el = document.getElementById('st'); if (el && cur) { const { c, w } = sums(cur.prog); el.textContent = `${c} right · ${w} wrong`; } }
async function doSave() {
  saveT = null; const c = pending; if (!c || !c.save) return;
  try {
    await api('saveProgress', { id: c.id, data: c.prog });
    const f = findSub(c.id); if (f) { f.x.stats = sums(c.prog); await persist(); }
  } catch (e) { toast('Progress not saved'); }
}
function beacon() {
  if (!saveT || !pending || !pending.save) return;
  clearTimeout(saveT); saveT = null; queue('saveProgress', { id: pending.id, data: pending.prog });
  fetch('/api/notes', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', 'x-password': pass },
    body: JSON.stringify({ action: 'saveProgress', id: pending.id, data: pending.prog }) }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') beacon(); });
addEventListener('pagehide', beacon);
function flush() { if (saveT) { clearTimeout(saveT); doSave(); } }
window.addEventListener('message', e => {
  const m = e.data; if (!m || !m.np || !cur) return;
  const fr = document.getElementById(cur.frame); if (!fr || e.source !== fr.contentWindow) return;
  if (m.np === 'hello') return fr.contentWindow.postMessage({ np: 'init', data: cur.prog, css: fontCss }, '*');
  if (m.np === 'rec') {
    const a = cur.prog[m.id] || (cur.prog[m.id] = { c: 0, w: 0 });
    m.ok ? a.c++ : a.w++; a.last = !!m.ok; a.p = m.p; a.t = Date.now(); updStat();
    if (cur.save) { idbSet('prog:' + cur.id, { data: cur.prog }); pending = cur; clearTimeout(saveT); saveT = setTimeout(doSave, 150); }
  }
});

/* ---------- offline: local database (IndexedDB) ---------- */
const idb = new Promise(res => { try { const r = indexedDB.open('nn', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } setTimeout(() => res(null), 1500); });
const idbGet = k => idb.then(db => db ? new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }) : undefined);
const idbSet = (k, v) => idb.then(db => db ? new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }) : undefined);

/* ---------- API with offline cache + outbox ---------- */
async function rawApi(action, data = {}) {
  const r = await fetch('/api/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-password': pass },
    body: JSON.stringify({ action, ...data })
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error('Wrong password'); e.auth = true; throw e; }
  if (!r.ok) { const e = new Error(j.error || 'Server error'); e.server = true; throw e; }
  return j;
}
const RK = { getTree: () => 'tree', getPrompts: () => 'prompts', getProgress: d => 'prog:' + d.id };
const qk = (a, d) => a + ':' + (d.id || '');
let warned = false, offTxt = '';
async function queue(action, data) { const o = (await idbGet('outbox')) || {}; o[qk(action, data)] = { action, data }; await idbSet('outbox', o); setOff(); }
async function unqueue(action, data) { const o = await idbGet('outbox'); const k = qk(action, data); if (o && o[k]) { delete o[k]; await idbSet('outbox', o); } }
function setOff(t) {
  if (t !== undefined) offTxt = t;
  idbGet('outbox').then(o => {
    const n = o ? Object.keys(o).length : 0, el = document.getElementById('off');
    if (el) el.textContent = (navigator.onLine ? '' : 'OFFLINE · ') + offTxt + (n ? ` · ${n} to sync` : '');
  });
}
async function api(action, data = {}) {
  // keep a local copy of everything written, so offline reads match
  if (action === 'saveTree') await idbSet('tree', { tree: data.tree });
  else if (action === 'savePrompts') await idbSet('prompts', { prompts: data.prompts });
  else if (action === 'saveProgress') await idbSet('prog:' + data.id, { data: data.data });
  else if (action === 'savePage') await idbSet('page:' + data.id, { html: data.html, v: data.v || 0 });
  try {
    const j = await rawApi(action, data);
    if (RK[action]) idbSet(RK[action](data), j);
    if (action.startsWith('save')) unqueue(action, data);
    warned = false; return j;
  } catch (e) {
    if (e.auth || e.server) throw e;
    if (RK[action]) { const c = await idbGet(RK[action](data)); if (c) return c; }
    if (action.startsWith('save')) {
      await queue(action, data);
      if (!warned) { warned = true; toast('Offline: saved on this device, will sync later'); }
      return { ok: true, queued: true };
    }
    throw new Error('Offline');
  }
}
let flushing = false;
async function flushOutbox() {
  if (flushing) return; flushing = true;
  try {
    const o = await idbGet('outbox'); if (!o) return;
    for (const k of Object.keys(o)) {
      try { await rawApi(o[k].action, o[k].data); }
      catch (e) { if (!e.server) break; }
      const c = (await idbGet('outbox')) || {}; delete c[k]; await idbSet('outbox', c);
    }
  } finally { flushing = false; setOff(); }
}
/* page HTML: cached on the phone, re-downloaded only when its version changes */
async function loadPage(id) {
  const f = findSub(id), v = (f && f.x.v) || 0, c = await idbGet('page:' + id);
  if (c && (c.v || 0) === v) return c.html;
  try { const j = await api('getPage', { id }); await idbSet('page:' + id, { html: j.html, v }); return j.html; }
  catch (e) { if (c) return c.html; throw e; }
}
let pf = false;
async function prefetchAll() {
  if (pf || !navigator.onLine) return; pf = true;
  const subs = tree.subjects.flatMap(s => s.topics.flatMap(t => t.subs)).filter(x => x.locked);
  let n = 0, bad = 0; setOff(`Saving offline 0/${subs.length}`);
  for (let i = 0; i < subs.length; i += 3)
    await Promise.all(subs.slice(i, i + 3).map(async x => {
      try { await loadPage(x.id); await api('getProgress', { id: x.id }); } catch { bad++; }
      setOff(`Saving offline ${++n}/${subs.length}`);
    }));
  pf = false; setOff(bad ? `Offline: ${bad} missing` : `Offline ready · ${subs.length}`);
}

async function persist() {
  try { await api('saveTree', { tree }); }
  catch (e) { toast('Save failed: ' + e.message); }
}

function ask({ title, value = '', type = 'text', input = true, ok = 'OK', danger = false, msg = '' }) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<div class="box"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}
      ${input ? `<input id="mi" type="${type}" value="${esc(value)}" maxlength="80" autocomplete="off">` : ''}
      <div class="row"><button class="btn ghost" id="mc">Cancel</button>
      <button class="btn ${danger ? 'red' : ''}" id="mo">${esc(ok)}</button></div></div>`;
    document.body.appendChild(d);
    const i = d.querySelector('#mi');
    if (i) { i.focus(); if (type === 'text') i.select(); i.addEventListener('keydown', e => { if (e.key === 'Enter') d.querySelector('#mo').click(); }); }
    const close = v => { d.remove(); res(v); };
    d.querySelector('#mc').onclick = () => close(null);
    d.querySelector('#mo').onclick = () => close(input ? (i.value.trim() || null) : true);
    d.onclick = e => { if (e.target === d) close(null); };
  });
}

/* ---------- tree helpers ---------- */
function findSubject(id) { return tree.subjects.find(s => s.id === id); }
function findTopic(id) { for (const s of tree.subjects) { const t = s.topics.find(t => t.id === id); if (t) return { s, t }; } }
function findSub(id) { for (const s of tree.subjects) for (const t of s.topics) { const x = t.subs.find(x => x.id === id); if (x) return { s, t, x }; } }
const subIdsOfTopic = t => t.subs.map(x => x.id);
const subIdsOfSubject = s => s.topics.flatMap(subIdsOfTopic);

const sha = async s => (window.crypto && crypto.subtle) ? [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('nn:' + s)))].map(b => b.toString(16).padStart(2, '0')).join('') : 'p:' + s;

  const pw = document.getElementById('pw');

    const typed = pw.value, er = document.getElementById('er'); er.textContent = ''; pass = typed;
    try {
      await rawApi('ping');
      localStorage.setItem('nn_pass', pass); await idbSet('auth', { pass, hash: await sha(pass) }); await boot();
    } catch (e) {
      pass = '';
      if (e.auth || e.server) return (er.textContent = e.message);
      const a = await idbGet('auth');   // no internet: check against the login saved on this phone

  let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<em>${d}</em>`).join('') + '<i></i>'.repeat(first);

  }

/* drag to reorder (grip handle; works with touch) */
let drag = null;
app.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  const item = g.closest('.drag-item'); if (!item) return;
  e.preventDefault(); drag = { item, type: item.dataset.type, id: e.pointerId }; item.classList.add('dragging');
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const { item, type } = drag, y = e.clientY;
  if (y < 70) scrollBy(0, -12); else if (y > innerHeight - 70) scrollBy(0, 12);
  const el = document.elementFromPoint(e.clientX, y); if (!el) return;
  const t = el.closest(`.drag-item[data-type="${type}"]`);
  if (t && t !== item && !item.contains(t)) {
    const r = t.getBoundingClientRect(); t.parentNode.insertBefore(item, y < r.top + r.height / 2 ? t : t.nextSibling);
  } else if (!t) { const box = el.closest(`[data-box="${type}"]`); if (box && !item.contains(box)) box.appendChild(item); }
});
function endDrag() {
  if (!drag) return; const d = drag; drag = null; d.item.classList.remove('dragging'); noClick = Date.now() + 400; commitOrder(d.type);
}
window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
function commitOrder(type) {
  const ids = box => [...box.children].filter(c => c.classList.contains('drag-item')).map(c => c.dataset.id);
  if (type === 'subject') {
    const m = new Map(tree.subjects.map(s => [s.id, s]));
    const n = ids(app.querySelector('[data-box="subject"]')).map(i => m.get(i)).filter(Boolean);
    if (n.length !== tree.subjects.length) return route();
    tree.subjects = n;
  } else {
    const s = findSubject(location.hash.split('/')[2]); if (!s) return route();
    const tm = new Map(s.topics.map(t => [t.id, t])), all = s.topics.flatMap(t => t.subs), sm = new Map(all.map(x => [x.id, x]));
    const order = ids(app.querySelector('[data-box="topic"]')).map(i => tm.get(i)).filter(Boolean);
    const subs = new Map(); let count = 0;
    app.querySelectorAll('[data-type="topic"]').forEach(card => { const l = ids(card.querySelector('[data-box="sub"]')).map(i => sm.get(i)).filter(Boolean); subs.set(card.dataset.id, l); count += l.length; });
    if (order.length !== s.topics.length || count !== all.length) return route();
    order.forEach(t => { t.subs = subs.get(t.id); }); s.topics = order;
  }
  persist();
}

/* ---------- extra offline tools: fonts, embed assets, restore ---------- */
let fontCss = '';
const b64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(blob); });
const dataUri = async u => { const r = await fetch(u); if (!r.ok) throw new Error('x'); return b64(await r.blob()); };
async function asyncReplace(str, re, fn) {
  const ms = [...str.matchAll(re)], out = await Promise.all(ms.map(m => fn(m).catch(() => m[0])));
  let i = 0; return str.replace(re, () => out[i++]);
}
/* Fonts are saved once on the phone and handed to every page, so notes show the Nothing fonts offline */
async function buildFontCss() {
  const put = css => { fontCss = css; if (!document.getElementById('nnfonts')) { const s = document.createElement('style'); s.id = 'nnfonts'; s.textContent = css; document.head.appendChild(s); } };
  const c = await idbGet('fontcss'); if (c) return put(c);
  if (!navigator.onLine) return;
  try {
    const link = document.querySelector('link[href*="fonts.googleapis.com/css2"]'); if (!link) return;
    const css = await (await fetch(link.href)).text();
    const blocks = [...css.matchAll(/\/\*\s*([\w-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g)].filter(m => m[1] === 'latin').map(m => m[2]);
    let out = '';
    for (const b of blocks) out += (await asyncReplace(b, /url\((https:[^)]+)\)/g, async m => `url(${await dataUri(m[1])})`)) + '\n';
    if (out) { await idbSet('fontcss', out); put(out); }
  } catch {}
}
/* Embed web images, scripts and stylesheets into the page so it works with no internet */
async function inlineAssets(html) {
  let n = 0, bad = 0;
  const cssUrls = (css, base) => asyncReplace(css, /url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, async m => {
    if (/^data:|^#/.test(m[2])) return m[0];
    try { const d = await dataUri(new URL(m[2], base).href); n++; return `url(${d})`; } catch { bad++; return m[0]; }
  });
  html = await asyncReplace(html, /<link\b[^>]*>/gi, async m => {
    const h = m[0].match(/href=["'](https?:[^"']+)["']/i);
    if (!h || !/rel=["']?stylesheet/i.test(m[0]) || /fonts\.googleapis\.com/.test(h[1])) return m[0];   // Google fonts are handled by the app
    try { const css = await (await fetch(h[1])).text(); n++; return '<style>/* inlined: ' + h[1] + ' */\n' + await cssUrls(css, h[1]) + '</style>'; } catch { bad++; return m[0]; }
  });
  html = await asyncReplace(html, /<script\b[^>]*\bsrc=["'](https?:[^"']+)["'][^>]*>\s*<\/script>/gi, async m => {
    if (/type=["']?module/i.test(m[0])) return m[0];
    try { const js = await (await fetch(m[1])).text(); n++; return '<script>' + js.replace(/<\/script/gi, '<\\/script') + '<\/script>'; } catch { bad++; return m[0]; }
  });
  html = await asyncReplace(html, /(<img\b[^>]*\bsrc=["'])(https?:[^"']+)(["'])/gi, async m => {
    try { const d = await dataUri(m[2]); n++; return m[1] + d + m[3]; } catch { bad++; return m[0]; }
  });
  return { html, n, bad };
}

/* ---------- actions ---------- */
const actions = {
  noop: () => {},
  restore() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      let b; try { b = JSON.parse(await file.text()); } catch { return toast('Not a valid backup'); }
      if (!b.tree || !Array.isArray(b.tree.subjects)) return toast('Not a valid backup');
      if (!await ask({ title: 'Restore this backup?', input: false, ok: 'Restore', danger: true, msg: 'This replaces your current subjects, pages and prompts with the backup.' })) return;
      toast('Restoring…');
      try {
        tree = b.tree; normTree(); prompts = b.prompts || [];
        for (const [id, html] of Object.entries(b.pages || {})) { const v = Date.now(), hit = findSub(id); if (hit) hit.x.v = v; await api('savePage', { id, html, v }); }
        await api('saveTree', { tree }); await api('savePrompts', { prompts }); toast('Restored'); route();
      } catch (e) { toast('Failed: ' + e.message); }
    };
    inp.click();
  },
  prefetch: () => prefetchAll(),
  viewSub: id => go('/v/' + id),
  editSub: id => go('/e/' + id),
  async setStatus(id) {
    const { x } = findSub(id); const v = await askStatus(x); if (!v) return;
    x.status = v.status;
    if (v.status === 'revision') { x.date = v.date; x.done = (x.done || []).filter(d => INT.some(n => addDays(v.date, n) === d)); }
    await persist(); route();
  },
  async addPrompt() {
    const v = await askForm('New prompt', [{ label: 'Title' }, { label: 'Prompt text', ta: true }]); if (!v) return;
    prompts.push({ id: uid(), title: v[0], text: v[1] }); await savePrompts(); route();
  },
  async editPrompt(id) {
    const p = prompts.find(x => x.id === id); const v = await askForm('Edit prompt', [{ label: 'Title', value: p.title }, { label: 'Prompt text', ta: true, value: p.text }]); if (!v) return;
    p.title = v[0]; p.text = v[1]; await savePrompts(); route();
  },
  async delPrompt(id) {
    if (!await ask({ title: 'Delete prompt?', input: false, ok: 'Delete', danger: true })) return;
    prompts = prompts.filter(x => x.id !== id); await savePrompts(); route();
  },
  async copyPrompt(id) {
    try { await navigator.clipboard.writeText(prompts.find(x => x.id === id).text); toast('Copied'); } catch { toast('Copy failed'); }
  },
  async copyPromptTpl(id) {
    try { const tpl = await (await fetch('/template.html')).text(); await navigator.clipboard.writeText(prompts.find(x => x.id === id).text + '\n\nTEMPLATE:\n' + tpl + '\n\nMY NOTES:\n'); toast('Copied with template'); } catch { toast('Copy failed'); }
  },
  async dlSubject(sid) {
    const s = findSubject(sid); toast('Preparing download…');
    try {
      const pages = await fetchPages(s.topics.flatMap(t => t.subs));
      const D = { name: s.name, topics: s.topics.map(t => ({ name: t.name, subs: t.subs.map(x => ({ name: x.name, html: pages[x.id] || '' })) })) };
      const doc = EXPORT.split('__TITLE__').join(esc(s.name)).replace('__DATA__', () => JSON.stringify(D).replace(/</g, '\\u003c'));
      saveFile(new Blob([doc], { type: 'text/html' }), s.name + '.html');
    } catch (e) { toast('Failed: ' + e.message); }
  },
  async backup() {
    toast('Preparing backup…');
    try {
      const pages = await fetchPages(tree.subjects.flatMap(s => s.topics.flatMap(t => t.subs)));
      saveFile(new Blob([JSON.stringify({ exported: new Date().toISOString(), tree, pages, prompts }, null, 1)], { type: 'application/json' }), 'notes-backup-' + today() + '.json');
    } catch (e) { toast('Failed: ' + e.message); }
  },
  home: () => go('/'),
  rev: () => go('/r'),
  selDay: id => { cal.sel = id; viewRev(); },
  prevM: () => { cal.m = new Date(cal.m.getFullYear(), cal.m.getMonth() - 1, 1); viewRev(); },
  nextM: () => { cal.m = new Date(cal.m.getFullYear(), cal.m.getMonth() + 1, 1); viewRev(); },
  async toggleRev(id, d) {
    const x = findSub(id).x, a = x.done || (x.done = []), i = a.indexOf(d.due);
    i < 0 ? a.push(d.due) : a.splice(i, 1); await persist(); viewRev();
  },
  async setDate(id) {
    const { x } = findSub(id);
    const v = await ask({ title: 'Study date', type: 'date', value: x.date || today(), ok: 'Save', msg: 'Revisions are scheduled at +1, 3, 7, 21 and 45 days from this date.' });
    if (!v) return;
    x.date = v; x.done = (x.done || []).filter(d => INT.some(n => addDays(v, n) === d)); await persist(); route();
  },
  async resetProg(id) {
    if (!await ask({ title: 'Reset MCQ progress?', input: false, ok: 'Reset', danger: true, msg: 'Correct/wrong history for this page will be cleared.' })) return;
    await api('saveProgress', { id, data: {} }); findSub(id).x.stats = null; await persist(); route();
  },
  async logout() {
    if (!await ask({ title: 'Lock the app?', input: false, ok: 'Lock', msg: 'You will need your password to open it again.' })) return;
    localStorage.removeItem('nn_pass'); const a = await idbGet('auth'); await idbSet('auth', { hash: a && a.hash }); pass = ''; viewLogin();
  },
  openSubject: id => go('/s/' + id),
  backSubject: id => go('/s/' + id),
  openSub: id => { const f = findSub(id); go((f.x.locked ? '/v/' : '/e/') + id); },

  async addSubject() {
    const n = await ask({ title: 'New subject', ok: 'Add' }); if (!n) return;
    tree.subjects.push({ id: uid(), name: n, topics: [] }); await persist(); route();
  },
  async renSubject(id) {
    const s = findSubject(id); const n = await ask({ title: 'Rename subject', value: s.name, ok: 'Save' });
    if (n) { s.name = n; await persist(); route(); }
  },
  async delSubject(id) {
    const s = findSubject(id);
    if (!await ask({ title: 'Delete subject?', input: false, ok: 'Delete', danger: true, msg: `“${s.name}” and everything inside it will be removed.` })) return;
    const ids = subIdsOfSubject(s);
    tree.subjects = tree.subjects.filter(x => x.id !== id);
    await persist(); api('deletePages', { ids }).catch(() => {}); route();
  },

  async addTopic(sid) {
    const n = await ask({ title: 'New topic', ok: 'Add' }); if (!n) return;
    findSubject(sid).topics.push({ id: uid(), name: n, subs: [] }); await persist(); route();
  },
  async renTopic(id) {
    const { t } = findTopic(id); const n = await ask({ title: 'Rename topic', value: t.name, ok: 'Save' });
    if (n) { t.name = n; await persist(); route(); }
  },
  async delTopic(id) {
    const { s, t } = findTopic(id);
    if (!await ask({ title: 'Delete topic?', input: false, ok: 'Delete', danger: true, msg: `“${t.name}” and its sub topics will be removed.` })) return;
    const ids = subIdsOfTopic(t); s.topics = s.topics.filter(x => x.id !== id);
    await persist(); api('deletePages', { ids }).catch(() => {}); route();
  },

  async addSub(tid) {
    const n = await ask({ title: 'New sub topic', ok: 'Add' }); if (!n) return;
    findTopic(tid).t.subs.push({ id: uid(), name: n, locked: false, status: 'not_started', done: [] }); await persist(); route();
  },
  async renSub(id) {
    const { x } = findSub(id); const n = await ask({ title: 'Rename sub topic', value: x.name, ok: 'Save' });
    if (n) { x.name = n; await persist(); route(); }
  },
  async delSub(id) {
    const { t, x } = findSub(id);
    if (!await ask({ title: 'Delete sub topic?', input: false, ok: 'Delete', danger: true, msg: `“${x.name}” and its HTML will be removed.` })) return;
    t.subs = t.subs.filter(y => y.id !== id);
    await persist(); api('deletePages', { ids: [id] }).catch(() => {}); route();
  },
  async unlock(id) {
    const { x } = findSub(id);
    if (!await ask({ title: 'Unlock to edit?', input: false, ok: 'Unlock', msg: 'This lets you replace the HTML again. Save to lock it once more.' })) return;
    x.locked = false; await persist(); go('/e/' + id);
  }
};

app.addEventListener('click', e => {
  if (Date.now() < noClick) return;
  const el = e.target.closest('[data-a]'); if (!el) return;
  e.stopPropagation();
  const fn = actions[el.dataset.a]; if (fn) fn(el.dataset.id, el.dataset);
});

/* ---------- router ---------- */
function route() {
  app.dataset.ok = '1';
  if (!pass) return viewLogin();
  const [, k, id] = (location.hash.slice(1) || '/').split('/');
  flush(); cur = null;
  window.scrollTo(0, 0);
  if (k === 'r') return viewRev();
  if (k === 's') return viewSubject(id);
  if (k === 'e') return viewEditor(id);
  if (k === 'v') return viewPage(id);
  viewHome();
}
window.addEventListener('hashchange', route);

async function boot() {
  try { buildFontCss(); await flushOutbox(); const [t, p] = await Promise.all([api('getTree'), api('getPrompts')]); tree = t.tree; prompts = p.prompts || []; normTree(); route(); prefetchAll(); if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }
  catch (e) {
    if (e.message === 'Offline') { app.innerHTML = `<div class="wrap"><div class="empty">OFFLINE AND NOTHING SAVED YET<br>OPEN ONCE WITH INTERNET<br><br><button class="btn ghost" onclick="boot()">Retry</button></div></div>`; return; }
    if (e.auth) { localStorage.removeItem('nn_pass'); idbSet('auth', {}); pass = ''; return viewLogin('Wrong password'); }
    app.innerHTML = `<div class="wrap"><div class="empty">${esc(e.message)}<br><br><button class="btn ghost" onclick="boot()">Retry</button></div></div>`;
  }
}

// sync across devices when you come back to the app
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !pass) return;
  const k = (location.hash.split('/')[1] || '');
  if (k === 'e' || k === 'v') return;
  try { await flushOutbox(); tree = (await api('getTree')).tree; normTree(); route(); prefetchAll(); } catch {}
});

addEventListener('online', async () => { await flushOutbox(); try { tree = (await api('getTree')).tree; normTree(); } catch {} prefetchAll(); });
addEventListener('offline', () => setOff());
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
(async () => {   // stay signed in: restore the saved login if the browser cleared localStorage
  if (!pass) { const a = await idbGet('auth'); if (a && a.pass) { pass = a.pass; localStorage.setItem('nn_pass', pass); } }
  pass ? boot() : viewLogin();
})();
</script>
