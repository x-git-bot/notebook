<script>
(function () {
  var a = document.getElementById('app');
  window.nnReset = function () {
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
    Promise.all(jobs).catch(function () {}).then(function () {
      try { indexedDB.deleteDatabase('nn'); } catch (e) {}
      setTimeout(function () { location.reload(); }, 600);
    });
  };
  function fail(m) {
    if (!a || a.getAttribute('data-ok') === '1') return;
    a.innerHTML = '<div class="boot">' + String(m).replace(/</g, '&lt;') + '<br><br><button onclick="nnReset()" style="background:#f2f2f2;color:#000;border:0;border-radius:999px;padding:10px 20px;font:12px monospace">Reset app cache &amp; reload</button></div>';
  }
  window.addEventListener('error', function (e) { fail('Error: ' + (e.message || 'unknown')); });
  window.addEventListener('unhandledrejection', function (e) { fail('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () { fail('The app did not start (build 11).'); }, 6000);
})();
</script>
<script>
const app = document.getElementById('app');
let pass = localStorage.getItem('nn_pass') || '';
// Inside the Android app (APK) the files are local, so requests go to your Vercel address
const IS_APP = !!window.Capacitor && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let apiBase = IS_APP ? (localStorage.getItem('nn_api') || '') : '';
let tree = { subjects: [] };

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const go = p => { location.hash = p; };

function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

const I={edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',power:'<path d="M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',back:'<path d="M15 5l-7 7 7 7"/>',reset:'<path d="M4 12a8 8 0 1 1 3 6.2M4 19v-5h5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',book:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',chev:'<path d="M6 9l6 6 6-6"/>',bell:'<path d="M6 17h12l-1.5-2V10a4.5 4.5 0 1 0-9 0v5zM10 20a2 2 0 0 0 4 0"/>',grip:'<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>'};
const ic = n => `<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const fmt = s => new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const INT = [1, 3, 7, 21, 45]; // spaced repetition gaps (days after study date)
function tasks() {
  const out = [];
  tree.subjects.forEach(s => s.topics.forEach(t => t.subs.forEach(x => {
    if (x.status !== 'revision' || !x.date) return;
    INT.forEach((n, i) => { const due = addDays(x.date, n); out.push({ s, t, x, due, r: i + 1, done: (x.done || []).includes(due) }); });
  })));
  return out;
}

/* ---- MCQ progress bridge: pages talk to the server through NP ---- */
const HELPER = '<script>(function(){var s={},rs=[];window.NP={loaded:false,data:function(){return s},record:function(id,ok,p){var a=s[id]||(s[id]={c:0,w:0});ok?a.c++:a.w++;a.last=!!ok;a.p=p;a.t=Date.now();parent.postMessage({np:"rec",id:id,ok:!!ok,p:p},"*");return a},onReady:function(f){rs.push(f);if(NP.loaded)f()}};addEventListener("message",function(e){if(e.data&&e.data.np==="init"){s=e.data.data||{};if(e.data.theme){document.documentElement.setAttribute("data-theme",e.data.theme)}if(e.data.css){var st=document.createElement("style");st.textContent=e.data.css;(document.head||document.documentElement).appendChild(st)}NP.loaded=true;rs.forEach(function(f){f()})}});parent.postMessage({np:"hello"},"*")})()<\/script>';
const wrap = h => /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + HELPER) : HELPER + h;
let cur = null, saveT = null, pending = null;
function sums(p) { let c = 0, w = 0; for (const k in p) { c += p[k].c || 0; w += p[k].w || 0; } return { c, w }; }
function updStat() { const el = document.getElementById('st'); if (el && cur) { const { c, w } = sums(cur.prog); el.textContent = `${c} right · ${w} wrong`; } }
async function doSave() {
  saveT = null; const c = pending; if (!c || !c.save) return;
  try {
    await api('saveProgress', { id: c.id, data: c.prog });
    const f = findSub(c.id); if (f) { f.x.stats = sums(c.prog); await persist(); }
  } catch (e) { toast('Progress not saved'); }
}
function beacon() {
  if (!saveT || !pending || !pending.save) return;
  clearTimeout(saveT); saveT = null; queue('saveProgress', { id: pending.id, data: pending.prog });
  fetch(apiBase + '/api/notes', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', 'x-password': pass },
    body: JSON.stringify({ action: 'saveProgress', id: pending.id, data: pending.prog }) }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') beacon(); });
addEventListener('pagehide', beacon);
function flush() { if (saveT) { clearTimeout(saveT); doSave(); } }
window.addEventListener('message', e => {
  const m = e.data; if (!m || !m.np || !cur) return;
  const fr = document.getElementById(cur.frame); if (!fr || e.source !== fr.contentWindow) return;
  if (m.np === 'hello') return fr.contentWindow.postMessage({ np: 'init', data: cur.prog, css: fontCss, theme: resolvedTheme() }, '*');
  if (m.np === 'rec') {
    const a = cur.prog[m.id] || (cur.prog[m.id] = { c: 0, w: 0 });
    m.ok ? a.c++ : a.w++; a.last = !!m.ok; a.p = m.p; a.t = Date.now(); updStat();
    if (cur.save) { idbSet('prog:' + cur.id, { data: cur.prog }); pending = cur; clearTimeout(saveT); saveT = setTimeout(doSave, 150); }
  }
});

/* ---------- offline: local database (IndexedDB) ---------- */
const idb = new Promise(res => { try { const r = indexedDB.open('nn', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } setTimeout(() => res(null), 1500); });
const idbGet = k => idb.then(db => db ? new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }) : undefined);
const idbSet = (k, v) => idb.then(db => db ? new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }) : undefined);

/* ---------- API with offline cache + outbox ---------- */
async function rawApi(action, data = {}) {
  const r = await fetch(apiBase + '/api/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-password': pass },
    body: JSON.stringify({ action, ...data })
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error('Wrong password'); e.auth = true; throw e; }

const RK = { getTree: () => 'tree', getPrompts: () => 'prompts', getLog: () => 'log', getProgress: d => 'prog:' + d.id };
const qk = (a, d) => a + ':' + (d.id || '');
let warned = false, offTxt = '';
async function queue(action, data) { const o = (await idbGet('outbox')) || {}; o[qk(action, data)] = { action, data }; await idbSet('outbox', o); setOff(); }
async function unqueue(action, data) { const o = await idbGet('outbox'); const k = qk(action, data); if (o && o[k]) { delete o[k]; await idbSet('outbox', o); } }
function setOff(t) {
  if (t !== undefined) offTxt = t;
  idbGet('outbox').then(o => {
    const n = o ? Object.keys(o).length : 0, el = document.getElementById('off');
    if (el) el.textContent = (navigator.onLine ? '' : 'OFFLINE · ') + offTxt + (n ? ` · ${n} to sync` : '');
  });
}
async function api(action, data = {}) {
  // keep a local copy of everything written, so offline reads match
  if (action === 'saveTree') await idbSet('tree', { tree: data.tree });
  else if (action === 'savePrompts') await idbSet('prompts', { prompts: data.prompts });
  else if (action === 'saveLog') await idbSet('log', { log: data.log });
  else if (action === 'saveProgress') await idbSet('prog:' + data.id, { data: data.data });
  else if (action === 'savePage') await idbSet('page:' + data.id, { html: data.html, v: data.v || 0 });
  try {
    const j = await rawApi(action, data);
    if (RK[action]) idbSet(RK[action](data), j);
    if (action.startsWith('save')) unqueue(action, data);
    warned = false; return j;
  } catch (e) {
    if (e.auth || e.server) throw e;
    if (RK[action]) { const c = await idbGet(RK[action](data)); if (c) return c; }
    if (action.startsWith('save')) {
      await queue(action, data);
      if (!warned) { warned = true; toast('Offline: saved on this device, will sync later'); }
      return { ok: true, queued: true };
    }
    throw new Error('Offline');
  }
}
let flushing = false;
async function flushOutbox() {
  if (flushing) return; flushing = true;
  try {
    const o = await idbGet('outbox'); if (!o) return;
    for (const k of Object.keys(o)) {
      try { await rawApi(o[k].action, o[k].data); }
      catch (e) { if (!e.server) break; }
      const c = (await idbGet('outbox')) || {}; delete c[k]; await idbSet('outbox', c);
    }
  } finally { flushing = false; setOff(); }
}
/* page HTML: cached on the phone, re-downloaded only when its version changes */
async function loadPage(id) {
  const f = ctxOf(id), v = (f && f.x.v) || 0, c = await idbGet('page:' + id);
  if (c && (c.v || 0) === v) return c.html;
  try { const j = await api('getPage', { id }); await idbSet('page:' + id, { html: j.html, v }); return j.html; }
  catch (e) { if (c) return c.html; throw e; }
}
let pf = false;
async function prefetchAll() {
  if (pf || !navigator.onLine) return; pf = true;
  const subs = tree.subjects.flatMap(s => s.topics.flatMap(t => t.subs)).concat(tree.routine ? [{ id: 'routine' }] : []).filter(x => x.id === 'routine' ? tree.routine.locked : x.locked);
  let n = 0, bad = 0; setOff(`Saving offline 0/${subs.length}`);
  for (let i = 0; i < subs.length; i += 3)
    await Promise.all(subs.slice(i, i + 3).map(async x => {
      try { await loadPage(x.id); await api('getProgress', { id: x.id }); } catch { bad++; }
      setOff(`Saving offline ${++n}/${subs.length}`);

  pf = false; setOff(bad ? `Offline: ${bad} missing` : `Offline ready · ${subs.length}`);
}

async function inlineAssets(html) {
  let n = 0, bad = 0;
  const cssUrls = (css, base) => asyncReplace(css, /url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, async m => {
    if (/^data:|^#/.test(m[2])) return m[0];

  });
  html = await asyncReplace(html, /<link\b[^>]*>/gi, async m => {
    const h = m[0].match(/href=["'](https?:[^"']+)["']/i);

    try { const css = await (await fetch(h[1])).text(); n++; return '<style>/* inlined: ' + h[1] + ' */\n' + await cssUrls(css, h[1]) + '</style>'; } catch { bad++; return m[0]; }
  });
  html = await asyncReplace(html, /<script\b[^>]*\bsrc=["'](https?:[^"']+)["'][^>]*>\s*<\/script>/gi, async m => {
    if (/type=["']?module/i.test(m[0])) return m[0];

/* ---- monthly PDF (built by hand, works offline) ---- */
const pdfEsc = s => String(s).replace(/[^\x20-\x7E]/g, '?').replace(/([\\()])/g, '\\$1');
function buildPdf(date) {
  const y = date.getFullYear(), mo = date.getMonth(), n = new Date(y, mo + 1, 0).getDate(), g = goal();
  const vals = [], bySub = {}; let tot = 0, hit = 0, act = 0;
  for (let d = 1; d <= n; d++) {
    const ds = `${y}-${pad(mo + 1)}-${pad(d)}`, m = dayMin(ds); vals.push(m); tot += m; if (m) act++; if (m >= g * 60) hit++;
    (studyLog[ds] || []).forEach(r => { bySub[r.s] = (bySub[r.s] || 0) + (r.a || 0) + (r.m || 0); });
  }
  const sc = Math.max(g * 1.5, Math.max(...vals) / 60), X0 = 110, W = 360;
  const txt = (s, x, yy, sz = 10, b = 0) => `BT /${b ? 'F2' : 'F1'} ${sz} Tf ${x} ${yy} Td (${pdfEsc(s)}) Tj ET\n`;
  let c = txt('Study report - ' + date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }), 40, 800, 18, 1);
  c += txt(`Total ${hm(tot)}  |  Days studied ${act}  |  Average per day ${hm(Math.round(tot / n))}  |  Goal ${g}h reached on ${hit} days`, 40, 776, 9);
  vals.forEach((m, i) => {
    const yy = 740 - i * 17, wd = new Date(y, mo, i + 1).toLocaleDateString('en-GB', { weekday: 'short' });
    c += txt(`${pad(i + 1)} ${wd}`, 40, yy, 9);
    c += `0.93 0.93 0.93 rg ${X0} ${yy - 3} ${W} 11 re f\n0.1 0.1 0.1 rg ${X0} ${yy - 3} ${(m / 60 / sc * W).toFixed(1)} 11 re f\n`;
    c += txt(m ? hm(m) : '-', X0 + W + 10, yy, 9);
  });
  const bx = (X0 + g / sc * W).toFixed(1);
  c += `0.84 0.1 0.13 RG 1.2 w ${bx} 756 m ${bx} ${740 - (n - 1) * 17 - 6} l S\n` + txt(`Goal ${g}h`, bx - 16, 760, 8);
  let sy = 740 - (n - 1) * 17 - 40;
  c += txt('By subject', 40, sy, 11, 1);
  Object.entries(bySub).sort((a, b) => b[1] - a[1]).slice(0, 7).forEach(([s, m], i) => { c += txt(`${s}: ${hm(m)}`, 40, sy - 16 - i * 14, 9); });
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Length ${c.length} >>\nstream\n${c}endstream`];
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xr = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  return new Blob([out], { type: 'application/pdf' });
}

  if (!pass) { const a = await idbGet('auth'); if (a && a.pass) { pass = a.pass; localStorage.setItem('nn_pass', pass); } }
  (pass && (!IS_APP || apiBase)) ? boot() : viewLogin();
})();
</script>
