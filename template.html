<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPIC TITLE</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500..800&family=Instrument+Sans:wght@400..700&family=Noto+Sans+Bengali:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===== 1. THEME + FONT (dark / light follows the app) - leave as is ===== */
:root{--bg:#0f1114;--card:#16181c;--line:#2a2d34;--tx:#e9e7e2;--mu:#8f939b;--red:#e5766f;--green:#6cc496;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f7;--card:#ffffff;--line:#e2e5ea;--tx:#14181d;--mu:#646d78;--red:#c4413a;--green:#1f8657;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#f4f5f7;--card:#ffffff;--line:#e2e5ea;--tx:#14181d;--mu:#646d78;--red:#c4413a;--green:#1f8657;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Instrument Sans','Noto Sans Bengali',system-ui,sans-serif;font-size:15px;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:0 14px 70px}
h1,h2{font-family:'Schibsted Grotesk','Noto Sans Bengali',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:0 0 10px}
h1{font-size:26px}h2{font-size:18px}
h3{font-family:'Instrument Sans','Noto Sans Bengali',sans-serif;font-weight:600;font-size:15px;margin:0 0 6px}
.label,.tab{font-family:'Instrument Sans','Noto Sans Bengali',sans-serif;font-weight:700}
.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.red{color:var(--red)}.green{color:var(--green)}
header{padding:18px 0 4px}
.note,.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.note li{margin:4px 0}.note table{border-collapse:collapse;width:100%}
.note td,.note th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.q p{margin:4px 0 10px}
.q button.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit}
.q button.right{background:var(--green);border-color:var(--green);color:#fff}
.q button.wrong{background:var(--red);border-color:var(--red);color:#fff}
.ex{margin-top:8px;color:var(--mu);border-top:1px dashed var(--line);padding-top:8px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;align-items:center;padding:10px 0;margin-top:22px;border-bottom:1px solid var(--line)}
.tab{background:none;border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 12px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tab.rs{margin-left:auto;color:var(--mu)}
</style>
</head>
<body>
<main>

<!-- ===== 2. TITLE ===== -->
<header>
  <div class="label">SUBJECT › TOPIC</div>
  <h1>Sub topic title<span class="red">.</span></h1>
</header>

<!-- ===== 3. NOTES: one <section class="note"> per concept. Copy, edit or delete a whole block. ===== -->
<section class="note">
  <h2>Concept 1</h2>
  <ul>
    <li>Key point</li>
    <li>Key point</li>
  </ul>
</section>

<section class="note">
  <h2>Concept 2</h2>
  <table>
    <tr><th>Term</th><th>Meaning</th></tr>
    <tr><td>A</td><td>...</td></tr>
  </table>
</section>

<!-- ===== 4. QUIZ AREA - leave as is ===== -->
<div class="bar" id="bar"></div>
<div id="qs"></div>

</main>

<script>
/* ===== 5. MCQ DATA: one line = one question. Add / delete lines freely.
   id   : unique and never changed (progress is saved against it)
   o    : exactly 4 options
   a    : index of the correct option (0, 1, 2 or 3)
   e    : short explanation ===== */
const MCQS = [
  {id:'q1', q:'Question text?', o:['Option A','Option B','Option C','Option D'], a:0, e:'Why A is correct.'},
  {id:'q2', q:'Question text?', o:['Option A','Option B','Option C','Option D'], a:2, e:'Why C is correct.'},
];

/* ===== 6. ENGINE - leave as is ===== */
if(!window.NP){window.NP=(function(){var s={};return{data:function(){return s},record:function(id,ok,p){var a=s[id]||(s[id]={c:0,w:0});ok?a.c++:a.w++;a.last=ok;a.p=p},reset:function(){s={}},onReady:function(f){f()}}})()}
const $=s=>document.querySelector(s); let filter='all';
function counts(){const d=NP.data();let r=0,w=0;MCQS.forEach(m=>{const x=d[m.id];if(x&&x.last===true)r++;else if(x&&x.last===false)w++});return{r:r,w:w,t:MCQS.length}}
function bar(){const c=counts(),t=(f,l,n)=>`<button class="tab ${filter===f?'on':''}" data-f="${f}">${l} ${n}</button>`;
  $('#bar').innerHTML=t('right','Right',c.r)+t('wrong','Wrong',c.w)+t('all','Total',c.t)+'<button class="tab rs" data-reset="1">Reset</button>'}
function render(){const d=NP.data();bar();
  const list=MCQS.filter(m=>{const x=d[m.id];return filter==='all'||(filter==='right'&&x&&x.last===true)||(filter==='wrong'&&x&&x.last===false)});
  $('#qs').innerHTML=list.map(m=>{const r=d[m.id],ans=r&&filter!=='wrong';
    return `<div class="q" ${ans?'data-done=1':''}><div class="label">Q${MCQS.indexOf(m)+1}${r?` · ${r.c} right · ${r.w} wrong`:''}</div><p>${m.q}</p>${m.o.map((o,j)=>`<button class="opt ${ans?(j===m.a?'right':(j===r.p&&!r.last?'wrong':'')):''}" data-q="${m.id}" data-j="${j}">${o}</button>`).join('')}<div class="ex" ${ans?'':'hidden'}>${m.e||''}</div></div>`}).join('')||'<p class="label">Nothing here yet</p>'}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-f]');if(t){filter=t.dataset.f;return render()}
  if(e.target.closest('[data-reset]')){if(NP.reset)NP.reset();return render()}
  const b=e.target.closest('button[data-q]');if(!b)return;const card=b.closest('.q');if(card.dataset.done)return;
  const m=MCQS.find(x=>x.id===b.dataset.q),j=+b.dataset.j,ok=j===m.a;card.dataset.done=1;NP.record(m.id,ok,j);
  card.querySelectorAll('button.opt').forEach((x,k)=>{if(k===m.a)x.classList.add('right');else if(k===j)x.classList.add('wrong')});
  card.querySelector('.ex').hidden=false;bar()});
NP.onReady(()=>{render();const f=document.querySelector('.q:not([data-done])');if(filter==='all'&&f&&Object.keys(NP.data()).length)f.scrollIntoView({block:'center'})});
</script>
</body>
</html>
